name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build production WASM
        run: ./gradlew :webApp:wasmJsBrowserProductionWebpack

      - name: Copy build output to docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r webApp/build/processedResources/wasmJs/main/. docs/
          cp -r webApp/build/kotlin-webpack/wasmJs/productionExecutable/. docs/

      - name: Commit and push docs/
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/
          git diff --staged --quiet || git commit -m "Deploy: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
